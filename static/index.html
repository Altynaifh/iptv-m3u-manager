<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>IPTV M3U Manager</title>
    <link rel="stylesheet" href="/static/index.css">
    <style>
        /* 弹窗通知样式 */
        #toast-container {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 3000;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .toast {
            background: var(--bg-surface);
            color: var(--text);
            padding: 12px 24px;
            border-radius: 8px;
            box-shadow: 0 4 15px var(--shadow);
            border: 1px solid var(--glass-border);
            backdrop-filter: blur(10px);
            font-size: 0.95em;
            display: flex;
            align-items: center;
            gap: 8px;
            animation: slideUp 0.3s ease-out;
            min-width: 200px;
            justify-content: center;
        }

        .toast.success {
            border-left: 4px solid var(--success);
        }

        .toast.error {
            border-left: 4px solid var(--danger);
        }

        .toast.info {
            border-left: 4px solid var(--info);
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeOut {
            to {
                opacity: 0;
                transform: translateY(-20px);
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <header>
            <h1>📺 IPTV M3U Manager</h1>
            <p>管理您的直播订阅、筛选、生成专属列表</p>
        </header>

        <section id="created_outputs_section">
            <div class="glass-card">
                <h2>🔗 已创建聚合</h2>
                <div id="output_list">暂无数据</div>
            </div>
        </section>

        <section id="subscriptions">
            <div id="sub_form_container" class="glass-card">
                <h2 id="sub_form_title">➕ 添加订阅源</h2>

                <div class="tab-container">
                    <button id="tab_normal" class="tab-btn active" onclick="switchSubTab('normal')">
                        🔗 普通订阅
                    </button>
                    <button id="tab_git" class="tab-btn" onclick="switchSubTab('git')">
                        📦 Git 仓库
                    </button>
                </div>

                <input type="hidden" id="edit_sub_id">
                <input type="hidden" id="sub_is_enabled" value="true">
                <div class="form-group">
                    <input type="text" id="sub_name" placeholder="名称 (例如: 卫视精品)" aria-label="订阅名称">
                </div>
                <div class="form-group">
                    <input type="text" id="sub_url" placeholder="M3U URL (多个地址请用英文逗号隔开)" aria-label="M3U URL">
                </div>
                <div class="form-group" id="ua_form_group">
                    <input type="text" id="sub_ua" list="ua_options" placeholder="User-Agent (可选，推荐选择下方常用 UA)" value="" aria-label="User-Agent">
                    <datalist id="ua_options">
                        <option value="AptvPlayer/1.4.1">APTV (iOS/Apple TV) - 推荐</option>
                        <option value="TiviMate/5.2.0 (Android 15)">TiviMate (Android TV) - 推荐</option>
                        <option value="Mozilla/5.0">默认 (Browser)</option>
                        <option value="VLC/3.0.18">VLC Media Player</option>
                        <option value="PotPlayer/1.7">PotPlayer (Windows)</option>
                    </datalist>
                </div>
                <div class="form-group">
                    <select id="sub_auto_update" aria-label="订阅自动更新间隔"
                        style="width: 100%; padding: 12px; background: var(--input-bg); border: 1px solid var(--glass-border); color: var(--text); border-radius: 8px; outline: none;">
                        <option value="0">自动更新: 关闭 (手动刷新)</option>
                        <option value="2">自动更新: 每 2 分钟 (测试用)</option>
                        <option value="60">自动更新: 每 1 小时</option>
                        <option value="720">自动更新: 每 12 小时</option>
                        <option value="1440">自动更新: 每 24 小时</option>
                        <option value="10080">自动更新: 每 7 天</option>
                    </select>
                </div>
                <div style="display: flex; gap: 10px;">
                    <button id="sub_btn" class="btn" onclick="addSubscription()">添加订阅</button>
                    <button id="sub_cancel_btn" class="btn btn-secondary" style="display: none;"
                        onclick="cancelEditSub()">取消修改</button>
                </div>
            </div>

            <div class="glass-card">
                <h2>📋 当前订阅</h2>
                <div id="sub_list">加载中...</div>
            </div>
        </section>

        <section id="outputs">
            <div class="glass-card">
                <h2>🛠️ 创建聚合列表</h2>

                    <div style="display: flex; gap: 10px;">

                <div class="form-group">

                    <div style="flex: 1;">

                            <option value="0">自动更新: 关闭 (手动刷新)</option>
                            <option value="2">自动更新: 每 2 分钟 (测试用)</option>
                            <option value="60">自动更新: 每 1 小时</option>
                            <option value="120">自动更新: 每 2 小时</option>
                            <option value="240">自动更新: 每 4 小时</option>
                            <option value="360">自动更新: 每 6 小时</option>
                            <option value="480">自动更新: 每 8 小时</option>
                            <option value="720">自动更新: 每 12 小时</option>
                            <option value="1440">自动更新: 每 24 小时</option>

    <!-- 任务中心面板 -->
    <div id="task_panel" class="task-panel">
        <div class="task-panel-header">
            <h3>任务中心</h3>
            <div style="display: flex; gap: 8px; align-items:center;">
                <button class="btn btn-sm" onclick="toggleTheme()" id="theme_toggle_btn"

                <button class="btn btn-sm" onclick="taskCenter.toggle()"
                    style="background:transparent; font-size: 1.2em; opacity: 0.7; border:none; padding:0 5px;">&times;</button>
            </div>
        </div>
        <div id="task_list_container" class="task-list-container">
            <div class="empty-task-state">暂无任务记录</div>
        </div>
        <div class="task-panel-footer">
            <button class="btn btn-sm btn-outline" style="flex: 1;" onclick="taskCenter.loadTasks()">🔄 刷新列表</button>
            <button class="btn btn-sm btn-danger-outline" style="flex: 1;" onclick="taskCenter.cleanupTasks()">🧹
                清理历史</button>
            <button class="btn btn-sm" style="flex: 1; background: var(--primary); color: #fff;"
                onclick="toggleConsole()">🖥️ 控制台</button>
        </div>
    </div>

    <script>
        window.previewDebounceTimer = null;
        window.searchDebounceTimer = null;
        let currentSubTab = 'normal';

        // --- 主题切换逻辑 ---
        function initTheme() {
            const savedTheme = localStorage.getItem('theme');
            const btn = document.getElementById('theme_toggle_btn');
            if (savedTheme === 'light') {
                document.documentElement.setAttribute('data-theme', 'light');
                if (btn) btn.innerText = '🌙 深色模式';
            } else {
                document.documentElement.removeAttribute('data-theme');
                if (btn) btn.innerText = '🌞 日间模式';
            }
        }

        function toggleTheme() {
            const currentTheme = document.documentElement.getAttribute('data-theme');
            const btn = document.getElementById('theme_toggle_btn');

            if (currentTheme === 'light') {
                // 切换到深色 (默认)
                document.documentElement.removeAttribute('data-theme');
                localStorage.setItem('theme', 'dark');
                if (btn) btn.innerText = '🌞 日间模式';
                showToast('已切换至深色模式', 'info');
            } else {
                // 切换到亮色
                document.documentElement.setAttribute('data-theme', 'light');
                localStorage.setItem('theme', 'light');
                if (btn) btn.innerText = '🌙 深色模式';
                showToast('已切换至日间模式', 'info');
            }
        }

        // 立即初始化主题
        initTheme();

        // ==========================================
        // 核心任务中心控制引擎 (NAS Style)
        // ==========================================
        class GlobalTaskCenter {
            constructor() {
                this.tasks = new Map();
                this.isVisible = false;
                this.ws = null;
                this.initialized = false;
            }

            init() {
                if (this.initialized) return;
                this.loadTasks();
                this.connectWS();
                this.initialized = true;
                this.updateBadge();
            }

            toggle() {
                const panel = document.getElementById('task_panel');
                this.isVisible = !this.isVisible;
                if (this.isVisible) {
                    panel.classList.add('active');
                    this.loadTasks(); // 展开时刷新
                } else {
                    panel.classList.remove('active');
                }
            }

            async loadTasks() {
                try {
                    const res = await fetch('/api/tasks/');
                    const data = await res.json();
                    data.forEach(task => this.tasks.set(task.id, task));
                    this.render();
                    this.updateBadge();
                } catch (e) {
                    console.error("Failed to load tasks", e);
                }
            }

            connectWS() {
                const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
                const wsUrl = `${protocol}//${window.location.host}/api/tasks/ws`;

                this.ws = new WebSocket(wsUrl);

                this.ws.onmessage = (event) => {
                    try {
                        const msg = JSON.parse(event.data);
                        if (msg.type === 'task_update') {
                            this.handleUpdate(msg.data);
                        } else if (msg.type === 'console_log') {
                            this.handleConsoleLog(msg);
                        }
                    } catch (e) { console.error("WS Message Error", e); }
                };

                this.ws.onclose = () => {
                    console.log("Task WS Closed. Reconnecting...");
                    setTimeout(() => this.connectWS(), 3000);
                };
            }

            handleConsoleLog(msg) {
                const output = document.getElementById('console_output');
                if (!output) return;

                const line = document.createElement('div');
                line.className = 'console-line';
                line.innerHTML = `<span class="log-time">[${msg.timestamp}]</span> <span class="log-content">${this.escapeHTML(msg.line)}</span>`;
                output.appendChild(line);

                // 自动滚动到最下方
                output.scrollTop = output.scrollHeight;

                // 限制行数 (300行) 防止内存溢出
                while (output.childNodes.length > 300) {
                    output.removeChild(output.firstChild);
                }
            }

            escapeHTML(str) {
                const p = document.createElement('p');
                p.textContent = str;
                return p.innerHTML;
            }

            handleUpdate(task) {
                const oldTask = this.tasks.get(task.id);
                const isStatusChange = oldTask && oldTask.status !== task.status;

                // 如果任务不存在或者状态/进度有变，则更新
                this.tasks.set(task.id, { ...oldTask, ...task });
                this.render();
                this.updateBadge();

                // 重点：任务状态变为终态时的强提醒
                if (isStatusChange) {
                    if (task.status === 'success') {
                        showToast(`任务成功: ${task.name}`, "success");
                    } else if (task.status === 'failure') {
                        showToast(`任务失败: ${task.name}`, "error");
                    } else if (task.status === 'canceled') {

            async cleanupTasks() {
                if (!confirm("确定要清理所有已完成的任务记录吗？\n(运行中的任务将被保留)")) return;
                try {
                    const res = await fetch('/api/tasks/cleanup', { method: 'DELETE' });
                    const result = await res.json();
                    if (result.status === 'success') {
                        showToast(result.message, "success");
                        // 局部清理本地缓存并重新渲染
                        for (const [id, task] of this.tasks.entries()) {
                            if (['success', 'failure', 'canceled'].includes(task.status)) {
                                this.tasks.delete(id);

                        this.render();

                if (runningCount > 0) {

        function makeDraggable(element, handle) {
            if (!element || !handle) return;
            let pos1 = 0, pos2 = 0, pos3 = 0, pos4 = 0;
            handle.onmousedown = dragMouseDown;

            function dragMouseDown(e) {
                e = e || window.event;
                e.preventDefault();
                pos3 = e.clientX;
                pos4 = e.clientY;
                document.onmouseup = closeDragElement;
                document.onmousemove = elementDrag;
                element.style.transition = 'none'; // 拖动时禁用动画
            }

            function elementDrag(e) {
                e = e || window.event;
                e.preventDefault();
                pos1 = pos3 - e.clientX;
                pos2 = pos4 - e.clientY;
                pos3 = e.clientX;
                pos4 = e.clientY;
                element.style.top = (element.offsetTop - pos2) + "px";
                element.style.left = (element.offsetLeft - pos1) + "px";
                element.style.bottom = 'auto'; // 清除原有对齐
                element.style.right = 'auto';
            }

            function closeDragElement() {
                document.onmouseup = null;
                document.onmousemove = null;
                element.style.transition = 'all 0.3s cubic-bezier(0.19, 1, 0.22, 1)'; // 恢复动画
            }
        }

            if (!confirm("🚨 警告：此操作将强制重启后端服务进程！\n\n这通常用于解决任务彻底假死且无法中止的情况。\n重启期间所有正在进行的任务将中断。\n确定要继续吗？")) return;

            try {
                showToast("正在发送重启指令...", "info");
                const res = await fetch('/api/system/restart', { method: 'POST' });
                const result = await res.json();

                if (result.status === 'success') {
                    // 显示全屏锁定遮罩
                    const overlay = document.createElement('div');
                    overlay.style.cssText = 'position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); z-index:9999; display:flex; flex-direction:column; align-items:center; justify-content:center; color:white; backdrop-filter:blur(10px);';
                    overlay.innerHTML = `
                        <div style="font-size: 3em; margin-bottom: 20px;">🔄</div>
                        <h2 style="color:white; margin:0;">正在重启服务...</h2>
                        <p style="opacity:0.7; margin-top:10px;">请稍后，系统正在尝试自动重新连接</p>
                        <div style="margin-top:20px; width:200px; height:4px; background:rgba(255,255,255,0.1); border-radius:2px; overflow:hidden;">
                            <div id="restart_progress" style="width:0%; height:100%; background:#6366f1; transition:width 5s linear;"></div>
                        </div>
                    `;
                    document.body.appendChild(overlay);

                    // 启动进度条动画
                    setTimeout(() => {
                        const bar = document.getElementById('restart_progress');
                        if (bar) bar.style.width = '100%';
                    }, 100);

                    // 5秒后尝试刷新页面
                    setTimeout(() => {
                        window.location.reload();
                    }, 5500);
                } else {
                    showToast(result.message, "error");
                }
            } catch (e) {
                showToast("重启指令由于连接中断无法确认，请5秒后手动刷新页面", "warning");
                // 同样执行刷新逻辑
                setTimeout(() => window.location.reload(), 5000);
            }
        }

        async function viewOutputPreview(slug, name) {
            window.currentEPGUrl = null;

            // 从全局 allOutputs 找配置
            const out = allOutputs.find(o => o.slug === slug);
            if (out) window.currentEPGUrl = out.epg_url;

            prepareModal(`预览聚合: ${name}`, true); // 传 true 显示检测按钮

            if (!out) {
                document.getElementById('channel_list').innerHTML = '无法找到聚合配置，请刷新页面重试';
                return;
            }

            try {
                // 解析配置
                let keywords = [];
                try {
                    const parsed = JSON.parse(out.keywords || "[]");
                    parsed.forEach(k => {
                        if (typeof k === 'string') keywords.push({ value: k, group: '' });
                        else keywords.push(k);
                    });
                } catch (e) { }

                const subIds = JSON.parse(out.subscription_ids || "[]");
                const excludedIds = JSON.parse(out.excluded_channel_ids || "[]");

                const payload = {
                    subscription_ids: subIds,
                    keywords: keywords,
                    filter_regex: out.filter_regex,
                    excluded_channel_ids: excludedIds
                };

                const res = await fetch('/outputs/preview', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const data = await res.json();

                // 把结果铺平并去重（避免一个频道匹配多个关键字导致多次出现）
                const seenIds = new Set();
                const excludedSet = new Set(excludedIds.map(id => parseInt(id))); // 确保是数字集合
                let flatChannels = [];
                for (const [key, list] of Object.entries(data)) {
                    list.forEach(c => {
                        if (!seenIds.has(c.id) && !excludedSet.has(c.id)) {
                            seenIds.add(c.id);
                            flatChannels.push(c);
                        }
                    });
                }

                currentChannels = flatChannels;
                filteredChannels = flatChannels;
                renderBaseTable(document.getElementById('channel_list'), true);
            } catch (err) {
                document.getElementById('channel_list').innerHTML = '预览加载失败: ' + err.message;
            }
        }

                            statusHtml = `<span style="color: #10b981; font-size: 0.85em;">✅ ${c.latency}ms</span>`;
                        } else {
                            statusHtml = `<span style="color: #ef4444; font-size: 0.85em;" title="${c.error || '未知'}">❌ 失败</span>`;
                        }
                    } else if (c.checking) {
                        statusHtml = `<span style="color: #fbbf24; font-size: 0.85em;">⏳ 检测中...</span>`;
                    }

                    // 深度检测 HTML
                    let visualHtml = '';
                    if (window.lastRenderShowActions) {
                        const image = c.visualImage || c.check_image;
                        const error = c.visualError || c.check_error;
                        const date = c.check_date;

                        let dateHtml = '';
                        if (date) {
                            let dateStr = date.replace(' ', 'T');
                            if (!dateStr.endsWith('Z')) dateStr += 'Z';
                            const dateObj = new Date(dateStr);
                            const now = new Date();
                            const mins = Math.floor((now - dateObj) / 60000);
                            let timeStr = mins < 60 ? `${mins}分前` : (mins < 1440 ? `${Math.floor(mins / 60)}时前` : `${Math.floor(mins / 1440)}天前`);
                            const hhmm = dateObj.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', hour12: false });
                            const isAuto = c.check_source === 'auto';
                            const autoTag = isAuto ? `<span style="background: rgba(251,191,36,0.15); color: #fbbf24; padding: 1px 4px; border-radius: 3px; font-size: 0.7em; border: 1px solid rgba(251,191,36,0.2); margin-left: 4px;">自动</span>` : '';
                            dateHtml = `<div style="font-size: 0.75em; opacity: 0.5; margin-top: 2px;">上次检测: ${timeStr} <small>(${hhmm})</small> ${autoTag}</div>`;
                        }

                        if (c.visualStatus === 'loading') {
                            visualHtml = `<td style="padding: 10px; font-size: 0.85em;">🔄 检测中...</td>`;
                        } else if ((c.visualStatus === 'ok' || !c.visualStatus) && image) {

                                <img src="${image}" style="height: 40px; cursor: zoom-in;" onclick="event.stopPropagation(); showLightbox('${image}')" title="点击放大">

                        } else if (c.visualStatus === 'error' || error) {
                            visualHtml = `<td style="padding: 10px;">
                                <div style="color: #ef4444; font-size: 0.8em;" title="${error || '检测失败'}">❌ 无画面</div>
                                ${dateHtml}
                            </td>`;
                        } else {
                            visualHtml = `<td style="padding: 10px; font-size: 0.8em; opacity: 0.5;">-</td>`;
                        }
                    }

                    return `
                    <tr onclick="handleCardClick(event, ${c.id})" class="${window.selectedChannelIds.has(c.id) ? 'card-selected' : ''}" style="border-bottom: 1px solid var(--glass-border); ${c.is_enabled === false ? 'opacity: 0.5; background: rgba(0,0,0,0.2);' : ''}">
                        ${window.lastRenderShowActions ? `<td style="padding: 10px;"><input type="checkbox" class="ch-checkbox" data-id="${c.id}" ${window.selectedChannelIds.has(c.id) ? 'checked' : ''} onchange="toggleChannelSelection(${c.id}, this.checked)"></td>` : ''}
                        <td id="logo_${renderOffset}_${batch.indexOf(c)}" style="padding: 10px;" data-label="Logo"><span class="channel-logo-slot channel-logo-slot--table">${c.logo ? `<img class="channel-logo-slot__img" src="${c.logo}" onerror="this.classList.add('channel-logo-slot__img--broken');this.removeAttribute('src');" alt="">` : ''}</span></td>
                        <td style="padding: 10px;" data-label="名称：">${c.name}</td>
                        <td style="padding: 10px;" data-label="TVG："><span style="font-size: 0.8em; opacity: 0.6;">${c.tvg_id || '-'}</span></td>
                        ${window.currentEPGUrl ? `
                        <td id="epg_${renderOffset}_${batch.indexOf(c)}" style="padding: 10px;" data-label="节目：">
                            <span style="font-size: 0.85em; color: var(--text-loading);">⏳ 加载中...</span>
                        </td>` : ''}
                        <td style="padding: 10px;" data-label="分组：">${c.group || '默认'}</td>
                        ${window.lastRenderShowActions ? `<td style="padding: 10px;" data-label="来源："><span style="font-size: 0.85em; opacity: 0.7;">${c.source || '未知'}</span></td>` : ''}
                        ${window.lastRenderShowActions ? `<td style="padding: 10px;" data-label="状态：">${statusHtml}</td>` : ''}
                        ${visualHtml.replace('<td ', '<td data-label="画面预览：" ')}
                        ${window.lastRenderShowActions ? `
                        <td style="padding: 10px;">
                            <button class="btn btn-sm" 
                                style="background: ${c.is_enabled !== false ? '#ef4444' : '#10b981'}; padding: 4px 8px; font-size: 0.8em;"
                                onclick="toggleChannel(${c.id})">
                                ${c.is_enabled !== false ? '禁用' : '启用'}
                            </button>
                            <button class="btn btn-sm" 
                                style="background: #6366f1; padding: 4px 8px; font-size: 0.8em; margin-left: 4px;"
                                onclick="event.stopPropagation(); copyChannelUrl('${c.url.replace(/'/g, "\\'")}')"
                                title="复制播放链接">
                                📋
                            </button>
                        </td>` : ''}
                    </tr>
                `}).join('');
            }

            if (renderOffset === 0) {
                list.innerHTML = html;
            } else {
                list.insertAdjacentHTML('beforeend', html);
            }

            // 批量加载 EPG (防卡死)
            if (window.currentEPGUrl) {
                batch.forEach((c, idx) => {
                    const isRefresh = !!window.forceRefreshEPG || (window.refreshSelectedOnly && window.selectedChannelIds.has(c.id));
                    // 移动端使用不同的 cell ID 前缀
                    const cellId = isMobileCardMode ? `mobile_epg_${renderOffset}_${idx}` : `epg_${renderOffset}_${idx}`;
                    enqueueEpgLoad(window.currentEPGUrl, c.tvg_id, c.name, cellId, c.logo, c.id, isRefresh);
                });
            }

            renderOffset = end;

            // 更新"加载更多"按钮
            const btnContainer = document.getElementById('load_more_container');
            if (btnContainer) {
                if (renderOffset >= filteredChannels.length) {
                    btnContainer.style.display = 'none';
                } else {
                    btnContainer.style.display = 'block';
                    const btn = btnContainer.querySelector('button');
                    if (btn) btn.innerText = `查看更多 (剩余 ${filteredChannels.length - renderOffset} 条)`;
                }
            }
        }

        // 复制频道播放链接到剪贴板
        async function copyChannelUrl(url) {

        // EPG 性能优化
        window.epgCache = new Map(); // 会话级缓存
        const pendingEpgRequests = new Map(); // 请求去重

        async function loadChannelEPG(epgUrl, tvgId, tvgName, cellId, currentLogo, channelId, isRefresh = false) {
            const cell = document.getElementById(cellId);
            if (!cell) return;

            try {
                // 合并/去重 Key (缓存 Key 不应包含 refresh 状态，否则刷新后的结果无法复用)
                const dedupeKey = `${epgUrl}_${tvgId}_${tvgName}`;

                // 1. 检查缓存 (如果不是刷新请求，则尝试读缓存)
                if (!isRefresh && window.epgCache.has(dedupeKey)) {
                    applyEpgData(cell, window.epgCache.get(dedupeKey), cellId);
                    return;
                }

                // 2. 检查是否有相同请求在处理
                if (pendingEpgRequests.has(dedupeKey)) {
                    const data = await pendingEpgRequests.get(dedupeKey);
                    applyEpgData(cell, data, cellId);
                    return;
                }

                // 3. 发起请求
                const fetchPromise = (async () => {
                    const url = `/api/epg/current?epg_url=${encodeURIComponent(epgUrl)}&tvg_id=${encodeURIComponent(tvgId || '')}&tvg_name=${encodeURIComponent(tvgName || '')}&current_logo=${encodeURIComponent(currentLogo || '')}&refresh=${isRefresh}`;
                    const res = await fetch(url);
                    return await res.json();
                })();

                pendingEpgRequests.set(dedupeKey, fetchPromise);

                const data = await fetchPromise;
                // 成功后更新缓存 (刷新请求也会覆盖缓存)
                window.epgCache.set(dedupeKey, data);
                pendingEpgRequests.delete(dedupeKey);

                applyEpgData(cell, data, cellId);
            } catch (e) {
                if (cell) {
                    cell.innerText = '加载失败';
                    cell.style.color = 'var(--text-failure, #ef4444)';
                    cell.title = e.message;
                    console.error("EPG Load Error:", e);
                }
            }
        }

        function applyEpgData(cell, data, cellId) {
            cell.innerText = data.program || '无节目信息';
            if (data.program && data.program !== 'No Program Info') {
                cell.style.color = 'var(--text-highlight)';
                cell.style.opacity = '1';
            } else {
                cell.style.opacity = '0.5';
            }

            // 更新台标逻辑
            if (data.logo) {
                const logoCellId = cellId.replace('epg_', 'logo_');
                const logoCell = document.getElementById(logoCellId);
                if (logoCell) {
                    const img = logoCell.querySelector('img');
                    if (!img || img.style.display === 'none') {
                        logoCell.innerHTML = `<img src="${data.logo}" style="height:30px; border-radius:4px">`;
                    }
                }
            }
        }

        // EPG 请求队列 (防卡死)
        const epgQueue = [];
        let activeEpgRequests = 0;
        const MAX_EPG_CONCURRENCY = 5; // 降低并发，减少服务端压力
        const EPG_REQ_TIMEOUT = 12000; // 12秒陈旧请求自动丢弃

        function enqueueEpgLoad(...args) {
            epgQueue.push({
                args: args,
                time: Date.now()
            });
            processEpgQueue();
        }

        async function processEpgQueue() {
            if (activeEpgRequests >= MAX_EPG_CONCURRENCY || epgQueue.length === 0) return;

            const item = epgQueue.shift();
            // 如果请求太旧了（比如滑动很快产生的过往请求），直接丢弃
            if (Date.now() - item.time > EPG_REQ_TIMEOUT) {
                processEpgQueue();
                return;
            }

            activeEpgRequests++;
            try {
                await loadChannelEPG(...item.args);
            } finally {
                activeEpgRequests--;
                setTimeout(processEpgQueue, 20); // 稍微拉开一点间距
            }
        }

        async function refreshEPG() {
            if (!window.currentEPGUrl) return;

            if (window.selectedChannelIds.size === 0) {
                alert("请先勾选需要操作的频道！");
                return;
            }

            const btn = document.getElementById('refresh_epg_btn');
            btn.innerText = '正在更新...';
            btn.disabled = true;

            // window.forceRefreshEPG = true; // 不再全部强制
            window.refreshSelectedOnly = true;

            renderOffset = 0;
            document.getElementById('channel_list_container').scrollTop = 0;
            renderBaseTable(document.getElementById('channel_list'), window.lastRenderShowActions);

            window.refreshSelectedOnly = false;

            btn.innerText = '🔄 刷新节目表';
            btn.disabled = false;
        }

        async function checkPageConnectivity() {
            // 确定检测目标
            let targetChannels = [];
            if (window.selectedChannelIds.size > 0) {
                targetChannels = filteredChannels.filter(c => window.selectedChannelIds.has(c.id));
            } else {
                alert("请先勾选需要操作的频道！");
                return;
            }

            if (targetChannels.length === 0) return;

            const confirmMsg = `即将检测选中的 ${targetChannels.length} 个频道的连通性 (耗时较长)，确定继续吗？`;
            if (targetChannels.length > 500 && !confirm(confirmMsg)) return;

            // 标记检测中
            targetChannels.forEach(c => c.checking = true);

            // 立即渲染加载动画
            renderOffset = 0;
            document.getElementById('channel_list_container').scrollTop = 0;
            renderBaseTable(document.getElementById('channel_list'), window.lastRenderShowActions);

            // 分批处理 (每批 50)
            const chunkSize = 50;
            for (let i = 0; i < targetChannels.length; i += chunkSize) {
                const chunk = targetChannels.slice(i, i + chunkSize);
                // 发送带 ID 的列表
                const items = chunk.map(c => ({ id: c.id, url: c.url }));

                try {
                    const res = await fetch('/check-connectivity', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ items: items })
                    });
                    const results = await res.json();

                    results.forEach(r => {
                        // 简单通过 URL 匹配
                        chunk.filter(c => c.url === r.url).forEach(c => {
                            c.checking = false;
                            c.status = r.status;
                            c.latency = r.latency;
                            c.error = r.error;
                        });
                    });

                } catch (err) {
                    console.error("Check failed for batch", err);
                    chunk.forEach(c => { c.checking = false; c.error = "Check Failed"; });
                }

                renderOffset = 0;
                renderBaseTable(document.getElementById('channel_list'), window.lastRenderShowActions);
            }
        }

        async function checkVisualConnectivity() {
            const btn = document.getElementById('check_visual_btn');

            // 如果正在检查，设置标志为 false 以取消
            if (window.isVisualChecking) {
                window.isVisualChecking = false;
                btn.innerText = "⏳ 正在取消...";
                btn.disabled = true;
                return;
            }

            if (filteredChannels.length === 0) return;

            // 1. 查找哪些是还没检测过的
            const freshThreshold = 30 * 60 * 1000;
            const now = new Date();

            // 辅助函数：判断频道是否已经有了“新鲜”的检测结果
            const isFreshlyFinished = (c) => {
                if (c.visualStatus) return true; // 本轮检测过的
                if (!c.check_date) return false; // 根本没检测过

                try {
                    // 兼容各种日期格式，确保解析正确
                    const dateStr = c.check_date.endsWith('Z') ? c.check_date : c.check_date.includes('+') ? c.check_date : c.check_date + 'Z';
                    const dateObj = new Date(dateStr);
                    return (now - dateObj) < freshThreshold;
                } catch (e) {
                    return false;
                }
            };

            const pendingChannels = filteredChannels.filter(c => !isFreshlyFinished(c));
            const completedCount = filteredChannels.length - pendingChannels.length;

            let targets = filteredChannels;
            if (completedCount > 0 && pendingChannels.length > 0) {
                // 如果有新鲜结果，提示是否跳过
                if (confirm(`当前列表共 ${filteredChannels.length} 个频道：\n- 30分钟内已有结果: ${completedCount} 个\n- 待检测/上次失败: ${pendingChannels.length} 个\n\n是否仅检测“待检测/上次失败”的频道？\n(确定：断点续传； 取消：全部重新检测)`)) {
                    targets = pendingChannels;
                }
            } else if (pendingChannels.length === 0 && filteredChannels.length > 0) {
                // 所有都没变动，提示全部重测
                if (!confirm(`所有 ${filteredChannels.length} 个频道在 30 分钟内都已检测过，是否要全部重新检测？`)) {
                    return;
                }
            }

            const count = targets.length;
            const confirmMsg = `即将对 ${count} 个频道进行深度检测（截图）。\n这将会非常耗时（每个频道约 3-5 秒）。\n\n确定要继续吗？`;
            if (count > 20 && !confirm(confirmMsg)) return;

            window.isVisualChecking = true;
            btn.disabled = false;
            btn.innerText = "🛑 取消检测";
            const originalBg = btn.style.background;
            btn.style.background = "var(--danger)";

            const autoDisable = document.getElementById('auto_disable_check').checked;

            // 初始标记为 loading (仅针对本次要检测的目标)
            targets.forEach(c => c.visualStatus = 'loading');
            renderOffset = 0;
            renderBaseTable(document.getElementById('channel_list'), window.lastRenderShowActions);

            // 分批处理 (深度检测要慢点)
            const chunkSize = 5;
            let finishedInThisSession = 0;

            for (let i = 0; i < targets.length; i += chunkSize) {
                if (!window.isVisualChecking) break;

                const chunk = targets.slice(i, i + chunkSize);
                const items = chunk.map(c => ({ id: c.id, url: c.url }));

                // 更新按钮进度
                btn.innerText = `🛑 取消 (${finishedInThisSession}/${count})`;

                try {
                    const res = await fetch('/check-stream-visual', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ items: items, auto_disable: autoDisable })
                    });
                    const results = await res.json();

                    results.forEach(r => {
                        const match = chunk.find(c => c.id === r.id);
                        if (match) {
                            finishedInThisSession++;
                            if (r.status) {
                                match.visualStatus = 'ok';
                                match.visualImage = r.image;
                                match.check_status = true;
                                match.check_image = r.image;
                                match.check_date = new Date().toISOString();
                            } else {
                                match.visualStatus = 'error';
                                match.visualError = r.error || '检测失败';
                                match.check_status = false;
                                match.check_image = null;

                                if (r.auto_disabled) {
                                    match.is_enabled = false;
                                }
                            }
                        }
                    });
                } catch (err) {
                    chunk.forEach(c => {
                        c.visualStatus = 'error';
                        c.visualError = "网络错误";
                        c.check_status = false;
                        c.check_image = null;
                        finishedInThisSession++;
                    });
                }

                renderOffset = 0;
                renderBaseTable(document.getElementById('channel_list'), window.lastRenderShowActions);
            }

            // 收尾
            const wasCancelled = !window.isVisualChecking;
            window.isVisualChecking = false;
            btn.disabled = false;
            btn.innerText = "📺 深度检测";
            btn.style.background = originalBg;

            // 如果是中途取消的，把还没轮到的 loading 状态清掉，保留已完成的
            targets.forEach(c => {
                if (c.visualStatus === 'loading') {
                    c.visualStatus = null;
                }
            });

            renderOffset = 0;
            renderBaseTable(document.getElementById('channel_list'), window.lastRenderShowActions);

            if (!wasCancelled) {
                showToast(`深度检测圆满完成！共处理 ${finishedInThisSession} 个频道。`, 'success');
            } else {
                showToast(`检测已提前中断，已保存 ${finishedInThisSession} 个结果。`, 'warning');
            }
        }

        async function toggleChannel(id) {
            try {
                const res = await fetch(`/channels/${id}/toggle`, { method: 'POST' });
                if (!res.ok) throw new Error("操作失败");
                const updated = await res.json();

                // 更新本地数据
                const item = currentChannels.find(c => c.id === id);
                if (item) {
                    item.is_enabled = updated.is_enabled;
                    // 局部更新 UI：不再重置偏移和滚动条，仅更新特定行
                    const toggleBtns = document.querySelectorAll(`button[onclick*="toggleChannel(${id})"]`);
                    toggleBtns.forEach(btn => {
                        const enable = updated.is_enabled !== false;
                        btn.innerText = enable ? '禁用' : '启用';
                        btn.style.background = enable ? '#ef4444' : '#10b981';
                        // 更新行样式
                        const tr = btn.closest('tr');
                        if (tr) {
                            tr.style.opacity = enable ? '1' : '0.5';
                            tr.style.background = enable ? 'transparent' : 'rgba(0,0,0,0.2)';
                        }
                    });
                    updatePreviewStats();
                }
            } catch (err) {
                alert("操作失败: " + err.message);
            }
        }

                                ${s.last_update_status || '等待更新'}
                            </span>
                        </div>

        window._subLastScrollY = 0;

        // 关键字标签逻辑
        // 预期格式: { value: 'k', group: 'g' }
        let keywords = [];

        function getMergedFilterKeywords() {
            const nameRules = keywords.map(k => ({ ...k, match_by: k.match_by || 'name' }));
            const groupRules = groupKeywords.map(k => ({ ...k, match_by: 'source_group' }));
            return [...nameRules, ...groupRules];
        }

        function ruleDisplayKey(kObj) {
            const matchBy = (kObj.match_by || 'name').toLowerCase();
            const prefix = matchBy === 'source_group' ? '[分组] ' : '';
            const base = prefix + (kObj.value || '');
            const g = (kObj.group || '').trim();
            return g ? `${base} → ${g}` : base;
        }

        let groupKeywords = [];
        let activeGroupKeyword = null;

        function handleGroupTagInput(e) {
            if (e.key !== 'Enter') return;
            e.preventDefault();
            const input = document.getElementById('group_tag_input');
            const val = (input.value || '').trim();
            if (!val) return;
            if (groupKeywords.some(k => k.value === val)) {
                input.value = '';
                return;
            }
            groupKeywords.push({ value: val, group: '', match_by: 'source_group' });
            activeGroupKeyword = val;
            activeKeyword = null;
            input.value = '';
            renderGroupTags();
            clearTimeout(window.previewDebounceTimer);
            window.previewDebounceTimer = setTimeout(updateRealtimePreview, 300);
        }

        function renderGroupTags(shouldFocus = true) {
            const container = document.getElementById('group_tag_container');

            container.classList.remove('editing-mode');
            container.querySelectorAll('.tag-editor-overlay').forEach(el => el.remove());

                const display = `<span class="tag-prefix" style="opacity:0.55;font-size:0.85em;margin-right:4px;">[分组]</span>${inner}`;
                return `
                    <span class="tag ${isActive}"

            const inp = document.getElementById('group_tag_input');

                inp.onkeydown = handleGroupTagInput;

        function selectGroupKeyword(val) {
            activeGroupKeyword = val;

            renderTags(false);
            renderGroupTags(false);

        function removeGroupTag(val) {

            if (activeGroupKeyword === val) {
                activeGroupKeyword = groupKeywords.length ? groupKeywords[groupKeywords.length - 1].value : null;

        document.getElementById('tag_input').addEventListener('keydown', handleTagInput);

        function handleTagInput(e) {
            if (e.key === 'Enter') {
                e.preventDefault();

                if (val) {
                    // 去重
                    const exists = keywords.some(k => k.value === val);
                    if (!exists) {
                        keywords.push({ value: val, group: '' });

                        // 自动切到新标签

                        input.value = '';

                }
            }
        }

        // 预览全局状态
        let lastPreviewData = {};
        let activeKeyword = null; // 存的是字符串
        let excludedChannelIds = new Set(); // 关键字预览：默认入选，点此排除
        let includedGroupChannelIds = new Set(); // 来源分组预览：默认不入选，点此选用

        function renderTags(shouldFocus = true) {
            const container = document.getElementById('tag_container');
            const input = document.getElementById('tag_input');

            // 清理编辑模式状态（如果有）
            container.classList.remove('editing-mode');
            container.querySelectorAll('.tag-editor-overlay').forEach(el => el.remove());

            container.querySelectorAll('.tag').forEach(el => el.remove());

            const tagsHtml = keywords.map((k, index) => {
                const isActive = k.value === activeKeyword ? 'active-tag' : '';
                const display = k.group ? `${k.value} <span style="opacity:0.6; font-size:0.9em">→ ${k.group}</span>` : k.value;
                return `
                    <span class="tag ${isActive}"
                          data-tag-index="${index}"
                          data-tag-value="${k.value.replace(/"/g, '&quot;')}">
                        <span class="tag-content">${display}</span>
                        <span class="tag-remove">&times;</span>
                    </span>
                `;
            }).join('');

            const inputRow = container.querySelector('.tag-input-row');
            container.querySelectorAll('.tag').forEach(el => el.remove());
            if (inputRow) {
                inputRow.insertAdjacentHTML('beforebegin', tagsHtml);
                const inp = inputRow.querySelector('#tag_input') || document.getElementById('tag_input');
                if (inp) inp.value = input.value;

                container.innerHTML = tagsHtml + container.innerHTML;

            document.getElementById('tag_input').addEventListener('keydown', handleTagInput);

        const TagDragManager = {
            isDragging: false,
            draggedEl: null,
            draggedIndex: null,
            originalTag: null,
            startX: 0,
            startY: 0,
            offsetX: 0,
            offsetY: 0,
            longPressTimer: null,
            LONG_PRESS_DELAY: 350,
            lastClickTime: 0,
            lastClickTag: null,
            DOUBLE_CLICK_DELAY: 300,
            mobileDoubleTapDelay: 400,
            targetIndex: null,
            boundMove: null,
            boundUp: null,
            pendingSingleClick: null,

            init() {
                const container = document.getElementById('tag_container');
                const tags = container.querySelectorAll('.tag');

                tags.forEach((tag) => {
                    const index = parseInt(tag.dataset.tagIndex);
                    tag.addEventListener('mousedown', (e) => this.onPointerDown(e, tag, index, 'mouse'));
                    tag.addEventListener('touchstart', (e) => this.onPointerDown(e, tag, index, 'touch'), { passive: false });

                    // 阻止右键菜单（移动端长按菜单）
                    tag.addEventListener('contextmenu', (e) => {
                        e.preventDefault();
                        return false;
                    });

                    const removeBtn = tag.querySelector('.tag-remove');
                    if (removeBtn) {
                        removeBtn.addEventListener('click', (e) => {
                            e.stopPropagation();
                            removeTag(tag.dataset.tagValue);
                        });
                        removeBtn.addEventListener('touchend', (e) => {
                            e.stopPropagation();
                            e.preventDefault();
                            removeTag(tag.dataset.tagValue);
                        });
                    }
                });

                // 全局拖拽状态清理
                this.setupGlobalCleanup();
            },

            setupGlobalCleanup() {
                // 页面可见性变化时清理拖拽状态（切换标签页时）
                document.addEventListener('visibilitychange', () => {
                    if (document.hidden && this.isDragging) {
                        this.forceCleanupDrag();
                    }
                });

                // 全局鼠标松开监听（防止事件丢失）
                document.addEventListener('mouseup', (e) => {
                    if (this.isDragging) {
                        this.endDrag();
                    }
                }, { capture: true });

                // 触摸结束监听（防止移动端事件丢失）
                document.addEventListener('touchend', (e) => {
                    if (this.isDragging && this.pointerType === 'touch') {
                        this.endDrag();
                    }
                }, { capture: true });
            },

            forceCleanupDrag() {
                if (this.isDragging) {
                    // 取消拖拽，恢复原状
                    if (this.draggedEl && this.draggedEl.parentNode) {
                        this.draggedEl.remove();
                    }
                    const container = document.getElementById('tag_container');
                    container.querySelectorAll('.tag').forEach(t => {
                        t.classList.remove('tag-shift-left', 'tag-shift-right');
                        t.style.transform = '';
                        t.style.transition = '';
                        t.style.visibility = '';
                        t.removeAttribute('data-dragging');
                    });
                    container.classList.remove('dragging-active');
                    this.targetIndex = null;
                }

                // 清理所有定时器
                if (this.longPressTimer) {
                    clearTimeout(this.longPressTimer);
                    this.longPressTimer = null;
                }
                if (this.pendingSingleClick) {
                    clearTimeout(this.pendingSingleClick);
                    this.pendingSingleClick = null;
                }

                // 清理所有事件监听器
                if (this.boundMove) {
                    document.removeEventListener('mousemove', this.boundMove);
                    document.removeEventListener('touchmove', this.boundMove);
                    this.boundMove = null;
                }
                if (this.boundUp) {
                    document.removeEventListener('mouseup', this.boundUp);
                    document.removeEventListener('touchend', this.boundUp);
                    document.removeEventListener('touchcancel', this.boundUp);
                    this.boundUp = null;
                }

                // 重置所有状态
                this.isDragging = false;
                this.draggedEl = null;
                this.draggedIndex = null;
                this.originalTag = null;
                this.pendingDrag = false;
                this.pendingTag = null;
                this.hasMoved = false;
            },

            getPointerPos(e, type) {
                if (type === 'touch' && e.touches && e.touches.length > 0) {
                    return { x: e.touches[0].clientX, y: e.touches[0].clientY };
                }
                if (type === 'touch' && e.changedTouches && e.changedTouches.length > 0) {
                    return { x: e.changedTouches[0].clientX, y: e.changedTouches[0].clientY };
                }
                return { x: e.clientX, y: e.clientY };
            },

            onPointerDown(e, tag, index, type) {
                if (e.target.classList.contains('tag-remove')) return;

                const pos = this.getPointerPos(e, type);
                this.startX = pos.x;
                this.startY = pos.y;
                this.pendingTag = tag;
                this.pendingIndex = index;
                this.pointerType = type;
                this.hasMoved = false;

                this.boundMove = (ev) => this.onPointerMove(ev, type);
                this.boundUp = (ev) => this.onPointerUp(ev, type);

                if (type === 'touch') {
                    // 阻止默认行为（文本选择、长按菜单等）
                    e.preventDefault();

                    document.addEventListener('touchmove', this.boundMove, { passive: false });
                    document.addEventListener('touchend', this.boundUp);
                    document.addEventListener('touchcancel', this.boundUp);

                    this.longPressTimer = setTimeout(() => {
                        if (!this.isDragging && !this.hasMoved) {
                            this.startDrag(tag, index, pos);
                            if (navigator.vibrate) navigator.vibrate(30);
                        }
                    }, this.LONG_PRESS_DELAY);
                } else {
                    document.addEventListener('mousemove', this.boundMove);
                    document.addEventListener('mouseup', this.boundUp);
                    this.pendingDrag = true;
                }
            },

            onPointerMove(e, type) {
                const pos = this.getPointerPos(e, type);
                const dx = Math.abs(pos.x - this.startX);
                const dy = Math.abs(pos.y - this.startY);

                if (dx > 5 || dy > 5) {
                    this.hasMoved = true;
                }

                if (this.longPressTimer) {
                    if (dx > 10 || dy > 10) {
                        clearTimeout(this.longPressTimer);
                        this.longPressTimer = null;
                    }
                }

                // PC端: 移动超过阈值才开始拖拽
                if (this.pendingDrag && !this.isDragging && this.pendingTag) {
                    if (dx > 8 || dy > 8) {
                        this.startDrag(this.pendingTag, this.pendingIndex, { x: this.startX, y: this.startY });
                        this.pendingDrag = false;
                    }
                }

                if (this.isDragging && this.draggedEl) {
                    if (type === 'touch') e.preventDefault();
                    this.draggedEl.style.left = (pos.x - this.offsetX) + 'px';
                    this.draggedEl.style.top = (pos.y - this.offsetY) + 'px';
                    this.updateDropTarget(pos);
                }
            },

            onPointerUp(e, type) {
                clearTimeout(this.longPressTimer);
                this.longPressTimer = null;

                if (type === 'touch') {
                    document.removeEventListener('touchmove', this.boundMove);
                    document.removeEventListener('touchend', this.boundUp);
                    document.removeEventListener('touchcancel', this.boundUp);
                } else {
                    document.removeEventListener('mousemove', this.boundMove);
                    document.removeEventListener('mouseup', this.boundUp);
                }

                if (this.isDragging) {
                    this.endDrag();
                } else if (this.pendingTag && !this.hasMoved) {
                    if (type === 'touch') {
                        this.handleMobileTap(this.pendingTag);
                    } else {
                        this.handleClick(this.pendingTag);
                    }
                }

                this.pendingDrag = false;
                this.pendingTag = null;
                this.hasMoved = false;
            },

            handleMobileTap(tag) {
                // 拖拽中忽略点击
                if (this.isDragging) return;
                // 拖拽中的标签忽略点击
                if (tag.getAttribute('data-dragging') === 'true') return;

                const tagValue = tag.dataset.tagValue;
                const now = Date.now();

                if (now - this.lastClickTime < this.mobileDoubleTapDelay && this.lastClickTag === tagValue) {
                    clearTimeout(this.pendingSingleClick);
                    this.pendingSingleClick = null;
                    this.enterEditMode(tag, tagValue);
                    this.lastClickTime = 0;
                    this.lastClickTag = null;
                    return;
                }

                this.lastClickTime = now;
                this.lastClickTag = tagValue;

                if (this.pendingSingleClick) {
                    clearTimeout(this.pendingSingleClick);
                }

                this.pendingSingleClick = setTimeout(() => {
                    if (this.lastClickTag === tagValue) {
                        selectKeyword(tagValue);
                    }
                    this.pendingSingleClick = null;
                    this.lastClickTime = 0;
                    this.lastClickTag = null;
                }, this.mobileDoubleTapDelay);
            },

            handleClick(tag) {
                const container = document.getElementById('tag_container');
                if (container.classList.contains('editing-mode')) return;

                const tagValue = tag.dataset.tagValue;
                const now = Date.now();

                if (now - this.lastClickTime < this.DOUBLE_CLICK_DELAY && this.lastClickTag === tagValue) {
                    this.enterEditMode(tag, tagValue);
                    this.lastClickTime = 0;
                    this.lastClickTag = null;
                } else {
                    this.lastClickTime = now;
                    this.lastClickTag = tagValue;
                    selectKeyword(tagValue);
                }
            },

            startDrag(tag, index, pos) {
                // 防止重复开始拖拽
                if (this.isDragging) return;

                // 清理之前的状态
                if (this.draggedEl && this.draggedEl.parentNode) {
                    this.draggedEl.remove();
                }

                this.isDragging = true;
                this.draggedIndex = index;
                this.originalTag = tag;
                this.pendingDrag = false;

                const rect = tag.getBoundingClientRect();
                this.offsetX = pos.x - rect.left;
                this.offsetY = pos.y - rect.top;

                // 获取原标签的计算样式（包括 hover 状态）
                const computedStyle = window.getComputedStyle(tag);
                const backgroundColor = computedStyle.backgroundColor;
                const filter = computedStyle.filter;
                const boxShadow = computedStyle.boxShadow;

                // 先隐藏原标签（在克隆之前），避免出现两个标签
                tag.style.visibility = 'hidden';
                tag.setAttribute('data-dragging', 'true');

                // 创建拖拽元素，保持原标签的外观
                this.draggedEl = tag.cloneNode(true);
                this.draggedEl.classList.add('tag-dragging');
                this.draggedEl.style.cssText = `
                    position: fixed;
                    left: ${rect.left}px;
                    top: ${rect.top}px;
                    width: ${rect.width}px;
                    height: ${rect.height}px;
                    z-index: 9999;
                    pointer-events: none;
                    background: ${backgroundColor};
                    filter: ${filter};
                    transform: scale(0.98);
                    opacity: 0.9;
                    box-shadow: ${boxShadow || '0 8px 25px rgba(99, 102, 241, 0.4)'};
                    transition: none;
                    margin: 0;
                    padding: 0;
                    display: flex;
                    align-items: center;
                    justify-content: center;
                `;
                document.body.appendChild(this.draggedEl);

                document.getElementById('tag_container').classList.add('dragging-active');
            },

            updateDropTarget(pos) {
                const container = document.getElementById('tag_container');
                const tags = Array.from(container.querySelectorAll('.tag'));

                let newTargetIndex = this.draggedIndex;

                for (let i = 0; i < tags.length; i++) {
                    const tag = tags[i];
                    if (tag.style.display === 'none') continue;

                    const rect = tag.getBoundingClientRect();
                    const tagIndex = parseInt(tag.dataset.tagIndex);
                    const centerX = rect.left + rect.width / 2;

                    if (pos.x < centerX) {
                        newTargetIndex = tagIndex;
                        if (tagIndex > this.draggedIndex) newTargetIndex = tagIndex;
                        break;
                    } else if (i === tags.length - 1) {
                        newTargetIndex = tagIndex + 1;
                    }
                }

                this.targetIndex = newTargetIndex;

                // 计算移动距离：使用原标签的宽度
                const originalRect = this.originalTag.getBoundingClientRect();
                const gap = 5;
                const moveDistance = -(originalRect.width + gap);

                // 让所有受影响的标签一起移动
                tags.forEach(tag => {
                    if (tag.style.display === 'none') return;

                    const tagIndex = parseInt(tag.dataset.tagIndex);
                    tag.style.transform = '';
                    tag.style.transition = '';

                    if (this.draggedIndex < newTargetIndex) {
                        // 向右拖拽：draggedIndex 到 newTargetIndex 之间的标签向左移动
                        if (tagIndex > this.draggedIndex && tagIndex <= newTargetIndex) {
                            tag.style.transform = `translateX(${moveDistance}px)`;
                            tag.style.transition = 'transform 0.25s cubic-bezier(0.2, 0, 0.2, 1)';
                        }
                    } else if (this.draggedIndex > newTargetIndex) {
                        // 向左拖拽：newTargetIndex 到 draggedIndex 之间的标签向右移动
                        if (tagIndex >= newTargetIndex && tagIndex < this.draggedIndex) {
                            tag.style.transform = `translateX(${-moveDistance}px)`;
                            tag.style.transition = 'transform 0.25s cubic-bezier(0.2, 0, 0.2, 1)';
                        }
                    }
                });
            },

            endDrag() {
                if (!this.isDragging) return;

                const container = document.getElementById('tag_container');
                const draggedEl = this.draggedEl;
                const originalTag = this.originalTag;

                // 清除其他标签的动画状态
                container.querySelectorAll('.tag').forEach(t => {
                    t.classList.remove('tag-shift-left', 'tag-shift-right');
                    t.style.transform = '';
                    t.style.transition = '';
                    t.removeAttribute('data-dragging');
                    // 恢复被隐藏的原标签
                    if (t.style.visibility === 'hidden') {
                        t.style.visibility = '';
                    }
                });
                container.classList.remove('dragging-active');

                // 如果位置发生了变化，更新数据并重新渲染
                if (this.targetIndex !== null && this.targetIndex !== this.draggedIndex) {
                    let insertAt = this.targetIndex;
                    if (insertAt > this.draggedIndex) insertAt--;

                    const item = keywords.splice(this.draggedIndex, 1)[0];
                    keywords.splice(insertAt, 0, item);

                    // 立即重新渲染，让标签出现在新位置
                    renderTags(false);

                    // 拖拽元素平滑淡出
                    if (draggedEl && draggedEl.parentNode) {
                        const newContainer = document.getElementById('tag_container');
                        const newTag = newContainer.querySelector(`.tag[data-tag-value="${item.value.replace(/"/g, '\\"')}"]`);

                    if (newValue && newValue !== originalValue) {
                        if (groupKeywords.some(k => k.value === newValue && k.value !== originalValue)) {
                            keywordInput.style.borderColor = '#ef4444';
                            keywordInput.classList.add('shake');
                            setTimeout(() => keywordInput.classList.remove('shake'), 500);
                            return;
                        }
                    }

                    if (newValue) {
                        kObj.value = newValue;
                        if (activeGroupKeyword === originalValue) activeGroupKeyword = newValue;
                    } else {
                        groupKeywords = groupKeywords.filter(k => k.value !== originalValue);
                    }

                    closeEditor();
                    renderGroupTags();
                    clearTimeout(window.previewDebounceTimer);
                    window.previewDebounceTimer = setTimeout(updateRealtimePreview, 300);
                };

                const cancelEdit = () => {
                    closeEditor();
                };

                editor.querySelector('.tag-edit-confirm').onclick = confirmEdit;
                editor.querySelector('.tag-edit-cancel').onclick = cancelEdit;

                keywordInput.onkeydown = (e) => {
                    if (e.key === 'Enter') { e.preventDefault(); confirmEdit(); }
                    else if (e.key === 'Escape') cancelEdit();
                };
            }
        };

function removeTag(val) {

        function updateKeywordGroup(val, newGroup) {
            let kObj = keywords.find(k => k.value === val);
            if (!kObj && activeGroupKeyword) {
                kObj = groupKeywords.find(k => k.value === val);
            }
            if (kObj) {
                kObj.group = newGroup.trim();

                else renderTags(); // 更新显示

        }



        function isGroupRule(kObj) {
            return kObj && (kObj.match_by || 'name') === 'source_group';
        }

        function collectPreviewBuckets() {
            const nameIds = new Set();
            const groupIds = new Set();
            const allIds = new Set();
            if (!lastPreviewData) return { nameIds, groupIds, allIds };
            keywords.forEach(k => {
                const key = ruleDisplayKey({ ...k, match_by: 'name' });
                (lastPreviewData[key] || []).forEach(c => {
                    if (c.id != null) {
                        nameIds.add(c.id);
                        allIds.add(c.id);
                    }
                });
            });
            groupKeywords.forEach(k => {
                const key = ruleDisplayKey({ ...k, match_by: 'source_group' });
                (lastPreviewData[key] || []).forEach(c => {
                    if (c.id != null) {
                        groupIds.add(c.id);
                        allIds.add(c.id);
                    }
                });
            });
            return { nameIds, groupIds, allIds };
        }

        function isChannelIncludedInAggregate(channelId) {
            const { nameIds, groupIds } = collectPreviewBuckets();
            if (nameIds.has(channelId) && !excludedChannelIds.has(channelId)) return true;
            if (groupIds.has(channelId) && includedGroupChannelIds.has(channelId)) return true;
            return false;
        }

        function computeSaveExcludedIds() {
            const { nameIds, groupIds, allIds } = collectPreviewBuckets();
            const output = new Set();
            nameIds.forEach(id => {
                if (!excludedChannelIds.has(id)) output.add(id);
            });
            includedGroupChannelIds.forEach(id => {
                if (groupIds.has(id)) output.add(id);
            });
            const excluded = [];
            allIds.forEach(id => {
                if (!output.has(id)) excluded.push(id);
            });
            return excluded;
        }

        function syncIncludedGroupFromSaved(excludedIdsArray) {
            includedGroupChannelIds = new Set();
            if (!lastPreviewData || !groupKeywords.length) return;
            const excluded = new Set(excludedIdsArray || []);
            groupKeywords.forEach(k => {
                const key = ruleDisplayKey({ ...k, match_by: 'source_group' });
                (lastPreviewData[key] || []).forEach(c => {
                    if (c.id != null && !excluded.has(c.id)) {
                        includedGroupChannelIds.add(c.id);
                    }
                });
            });
        }

        // 切换频道在当前聚合表中的排除状态（本地操作，保存时一起提交）

        function _previewContextFromEl(btn) {
            const root = btn.closest('.preview-float');
            if (!root) return null;
            let ids = [];
            try {
                ids = JSON.parse(root.dataset.previewChannelIds || '[]');
            } catch (e) {
                ids = [];
            }
            const groupMode = root.dataset.previewGroupMode === '1';
            return { root, ids, groupMode };
        }

        function previewBulkSelectAll(btn) {
            const ctx = _previewContextFromEl(btn);
            if (!ctx || !ctx.ids.length) return;
            if (ctx.groupMode) {
                ctx.ids.forEach(id => includedGroupChannelIds.add(id));
                showToast('已全选选用', 'success');
            } else {
                ctx.ids.forEach(id => excludedChannelIds.delete(id));
                showToast('已全选入选', 'success');
            }
            patchAllPreviewChannelRowsInView(ctx.root);
        }

        function previewBulkInvert(btn) {
            const ctx = _previewContextFromEl(btn);
            if (!ctx || !ctx.ids.length) return;
            if (ctx.groupMode) {
                ctx.ids.forEach(id => {
                    if (includedGroupChannelIds.has(id)) includedGroupChannelIds.delete(id);
                    else includedGroupChannelIds.add(id);
                });
                showToast('已反选选用状态', 'info');
            } else {
                ctx.ids.forEach(id => {
                    if (excludedChannelIds.has(id)) excludedChannelIds.delete(id);
                    else excludedChannelIds.add(id);
                });
                showToast('已反选入选状态', 'info');
            }
            patchAllPreviewChannelRowsInView(ctx.root);
        }

            if (includedGroupChannelIds.has(channelId)) {
                includedGroupChannelIds.delete(channelId);
                showToast('已取消选用', 'info');
            } else {
                includedGroupChannelIds.add(channelId);
                showToast('频道已选用', 'success');

            let icon = 'ℹ️';

            toast.innerHTML = `<span style="margin-right:8px">${icon}</span> ${message}`;

            container.appendChild(toast);

        async function updateRealtimePreview() {
            const selectedSubs = Array.from(document.querySelectorAll('input[name="selected_subs"]:checked')).map(cb => parseInt(cb.value));

            const mergedKeywords = getMergedFilterKeywords();
            if (selectedSubs.length === 0 && mergedKeywords.length === 0) {
                hideAllPreviewWindows();
                return;
            }

            const data = {
                subscription_ids: selectedSubs,
                keywords: mergedKeywords,
                filter_regex: document.getElementById('out_regex').value || ".*"
            };

            try {
                const res = await fetch('/outputs/preview', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                const groupedResults = await res.json();
                lastPreviewData = groupedResults;

                const merged = getMergedFilterKeywords();
                if (merged.length > 0) {
                    const nameOk = activeKeyword && keywords.some(k => k.value === activeKeyword);
                    const groupOk = activeGroupKeyword && groupKeywords.some(k => k.value === activeGroupKeyword);
                    if (!nameOk && !groupOk) {
                        const last = merged[merged.length - 1];
                        if ((last.match_by || 'name') === 'source_group') {
                            activeGroupKeyword = last.value;
                            activeKeyword = null;
                        } else {
                            activeKeyword = last.value;
                            activeGroupKeyword = null;
                        }
                    }
                } else {
                    activeKeyword = null;
                    activeGroupKeyword = null;
                }

                renderTags();
                renderGroupTags(false);

                // 全局统计计算
                refreshGlobalStats();

                if (document.getElementById('edit_output_id').value && groupKeywords.length) {
                    // 编辑态首次预览后保持已保存的选用关系
                }
                renderSelectedPreview();

            } catch (err) {
                console.error('预览加载失败:', err);
                hideAllPreviewWindows();
            }
        }

        async function addSubscription() {
            const editId = document.getElementById('edit_sub_id').value;
            const nameInput = document.getElementById('sub_name').value.trim();
            const urlInput = document.getElementById('sub_url').value;
            const uaInput = document.getElementById('sub_ua').value;
            const autoMinutes = parseInt(document.getElementById('sub_auto_update').value);


            const urls = urlInput.split(/[\n,]+/).map(u => u.trim()).filter(u => u);

            if (urls.length === 0) {
                alert("请输入至少一个订阅地址");
                return;
            }

            if (editId) {
                // 修改模式：仅允许修改单个 URL（批量修改很复杂）
                if (urls.length > 1) {
                    showToast("修改模式下不支持批量输入，请只保留一个 URL", "error");
                    return;
                }
                await submitSingleSub(editId, nameInput, urls[0], uaInput, autoMinutes, 'PUT');
            } else {
                // 添加模式：支持批量
                showStatus(`准备添加 ${urls.length} 个订阅...`);
                let successCount = 0;

                for (let i = 0; i < urls.length; i++) {
                    const u = urls[i];
                    // 名称生成规则: "名称", "名称_2", "名称_3"...
                    let name = nameInput;
                    if (urls.length > 1 && nameInput) {
                        name = (i === 0) ? nameInput : `${nameInput}_${i + 1}`;
                    }

                    const ok = await submitSingleSub(null, name, u, uaInput, autoMinutes, 'POST');
                    if (ok) successCount++;
                }

                if (successCount > 0) {
                    showStatus(`成功添加 ${successCount} / ${urls.length} 个订阅`);
                    fetchSubs();
                    cancelEditSub();
                }
            }
        }

        async function submitSingleSub(id, name, url, ua, autoMinutes, method) {
            const sub = {
                name: name,
                url: url,
                user_agent: ua,
                headers: "{}",
                auto_update_minutes: autoMinutes,
                is_enabled: document.getElementById('sub_is_enabled').value === 'false' ? false : true
            };

            const apiUrl = id ? `/subscriptions/${id}` : '/subscriptions/';

            try {
                const res = await fetch(apiUrl, {
                    method: method,
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(sub)
                });

                if (res.ok) {
                    if (method === 'PUT') {
                        showToast('修改成功', 'success');
                        fetchSubs();
                        cancelEditSub();
                    }
                    return true;
                } else {
                    const error = await res.json();
                    const msg = error.detail || '未知错误';
                    console.error(`保存 ${url} 失败:`, msg);
                    if (method === 'PUT') showToast('保存失败: ' + msg, 'error');
                    return false;
                }
            } catch (err) {
                console.error(`${url} 的网络错误:`, err);
                if (method === 'PUT') showToast('网络连接失败', 'error');
                return false;
            }
        }

                    if (!item.match_by) item.match_by = 'name';

                        groupKeywords.push({ value: item.value, group: item.group || '', match_by: 'source_group' });

        async function copyToClipboard(text) {
            try {
                // 先试新的 API
                if (navigator.clipboard) {
                    await navigator.clipboard.writeText(text);
                    showStatus('已复制到剪贴板');
                    return;
                }
                throw new Error('Clipboard API unavailable');
            } catch (err) {
                // 降级方案 (HTTP 这种不安全环境)
                try {
                    const textArea = document.createElement("textarea");
                    textArea.value = text;
                    textArea.style.position = "fixed";
                    textArea.style.left = "-9999px";
                    document.body.appendChild(textArea);
                    textArea.focus();
                    textArea.select();
                    document.execCommand('copy');
                    document.body.removeChild(textArea);
                    showStatus('已复制到剪贴板 (Fallback)');
                } catch (fallbackErr) {
                    console.error('复制失败:', fallbackErr);
                    alert('复制失败，请手动复制: ' + text);
                }
            }
        }

        function showStatus(msg) {

                return;
            }
            s.innerText = msg;
            s.style.display = 'block';
            s.style.background = '#6366f1';
            setTimeout(() => { if (s) s.style.display = 'none'; }, 3000);
        }

        function toggleChannelSelection(id, isChecked) {
            id = parseInt(id); // 确保 ID 为整数

            // 更新选中状态集合
            if (isChecked) {
                window.selectedChannelIds.add(id);
            } else {
                window.selectedChannelIds.delete(id);
